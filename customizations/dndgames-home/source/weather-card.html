<!-- DNDGAMES-WEATHER-LOCATION-V23 DIALOG -->
<div id="dnd-weather-settings" role="dialog" aria-modal="true" aria-labelledby="dnd-location-title" aria-describedby="dnd-location-current" aria-hidden="true" style="display:none">
  <div class="dnd-location-panel">
    <button id="dnd-location-close" type="button" aria-label="Close weather settings">&#215;</button>
    <h2 id="dnd-location-title">Weather location</h2>
    <p id="dnd-location-current"></p>
    <label for="dnd-location-query">Town or postcode</label>
    <div class="dnd-location-search-row">
      <input id="dnd-location-query" type="text" maxlength="100" autocomplete="off" autocapitalize="words" placeholder="For example, Staines or Paris, France">
      <button id="dnd-location-search" type="button">Search</button>
    </div>
    <p id="dnd-location-status" role="status" aria-live="polite"></p>
    <div id="dnd-location-results" aria-label="Matching locations" aria-busy="false"></div>
    <div class="dnd-location-actions"><button id="dnd-location-cancel" type="button">Cancel</button><button id="dnd-location-save" type="button" disabled>Save location</button></div>
    <p class="dnd-location-privacy">Saves in this Home view on this TV. Search uses Open-Meteo / GeoNames. No automatic location detection.</p>
  </div>
</div>
<!-- END DNDGAMES-WEATHER-LOCATION-V23 DIALOG -->
