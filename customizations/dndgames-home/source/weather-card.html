<!-- CI compatibility v2.3.1: dynamic fields are populated by translated JavaScript. -->
<!-- DNDGAMES-CLEAN-WEATHER-V21 CARD -->
<aside id="dnd-weather" aria-label="" data-weather-state="loading">
  <div class="wx-head"><span class="wx-place" id="dnd-wx-place">&mdash;</span><span class="wx-country" id="dnd-wx-country">&mdash;</span><button id="dnd-wx-change" type="button" title="Change weather location (Blue button, or Up from top row then OK)" data-t-title="home.weather.changeHelp" aria-haspopup="dialog" aria-controls="dnd-weather-settings" data-t="home.weather.change">Change</button></div>
  <div class="wx-main">
    <span class="wx-icon" id="dnd-wx-icon" aria-hidden="true"></span>
    <span class="wx-temp" id="dnd-wx-temp">&mdash;</span>
    <div class="wx-desc"><div class="wx-condition" id="dnd-wx-condition">&mdash;</div><div class="wx-feels" id="dnd-wx-feels">&mdash;</div></div>
  </div>
  <div class="wx-detail" id="dnd-wx-detail">&mdash;</div>
  <div class="wx-days" id="dnd-wx-days"></div>
  <div class="wx-foot"><span class="wx-stamp" id="dnd-wx-stamp">&mdash;</span><span><a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" tabindex="-1" data-t="home.weather.provider">Open-Meteo</a> &middot; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer" tabindex="-1" data-t="home.weather.licence">CC BY 4.0</a></span></div>
</aside>
<!-- END DNDGAMES-CLEAN-WEATHER-V21 CARD -->

<!-- DNDGAMES-WEATHER-LOCATION-V23 DIALOG -->
<div id="dnd-weather-settings" role="dialog" aria-modal="true" aria-labelledby="dnd-location-title" aria-describedby="dnd-location-current" aria-hidden="true" style="display:none">
  <div class="dnd-location-panel">
    <button id="dnd-location-close" type="button" aria-label="Close weather settings" data-t-aria-label="home.weather.closeSettings">&#215;</button>
    <h2 id="dnd-location-title" data-t="home.weather.locationTitle">Weather location</h2>
    <p id="dnd-location-current"></p>
    <label for="dnd-location-query" data-t="home.weather.locationQuery">Town or postcode</label>
    <div class="dnd-location-search-row">
      <input id="dnd-location-query" type="text" maxlength="100" autocomplete="off" autocapitalize="words" placeholder="For example, Staines or Paris, France" data-t-placeholder="home.weather.locationExample">
      <button id="dnd-location-search" type="button" data-t="home.weather.search">Search</button>
    </div>
    <p id="dnd-location-status" role="status" aria-live="polite"></p>
    <div id="dnd-location-results" aria-label="Matching locations" data-t-aria-label="home.weather.matchingLocations" aria-busy="false"></div>
    <div class="dnd-location-actions"><button id="dnd-location-cancel" type="button" data-t="home.weather.cancel">Cancel</button><button id="dnd-location-save" type="button" disabled data-t="home.weather.saveLocation">Save location</button></div>
    <p class="dnd-location-privacy" data-t="home.weather.privacy">Saves in this Home view on this TV. Search uses Open-Meteo / GeoNames. No automatic location detection.</p>
  </div>
</div>
<!-- END DNDGAMES-WEATHER-LOCATION-V23 DIALOG -->
